env:
  DEPLOY_BASE_DIR: |
    dev:C:/DEV/deployments
    uat:C:/ABHI_DATA/abhi_deployments/frontend_deployments
    prod:C:/PROD/deployments
  WEB_ROOT: |
    dev:C:/DEV/webroot
    uat:C:/USP/ABHI_DEPLOY
    prod:C:/PROD/webroot
  SERVERS: |
    dev:${{ secrets.DEV_SSH_HOST }}:${{ secrets.DEV_SSH_USER }}:${{ secrets.DEV_SSH_PORT }}
    uat:${{ secrets.UAT_SSH_HOST }}:${{ secrets.UAT_SSH_USER }}:${{ secrets.UAT_SSH_PORT }}
    prod:${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_SSH_USER }}:${{ secrets.PROD_SSH_PORT }}
  SONAR_PROJECT_KEY: "frontend-sonar-project"
  APP_POOL_NAME: "ABHIDEPLOY"
  SITE_NAME: "ABHIUSP"
  BINDING_HOST: "usp.monocept.ai"
  PORT: 8443

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    #environment: ${{ github.event.inputs.environment }}


    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 10

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.20.3'

    # - name: Cache Node modules
    #   uses: actions/cache@v3
    #   with:
    #     path: |
    #       ~/.npm
    #       ~/.cache
    #     key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    #     restore-keys: |
    #       ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Clean previous build artifacts
      run: |
        rm -rf ./dist/*

    - name: Build the project
      run: npm run build --prod

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: angular-artifacts
        path: ./dist/*

    # - name: Debug:List files after downloading artifacts
    #   run: ls -l ./dist/

    # - name: SonarQube Scan
    #   uses: sonarsource/sonarqube-scan-action@v3.0.0
    #   with:
    #     projectBaseDir: .
    #     args: |
    #       -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
    #       -Dsonar.sources=./src
    #   env:
    #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # - name: Check SonarQube Quality Gate
    #   run: |
    #     status=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: \
    #       "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=${{ env.SONAR_PROJECT_KEY }}" \
    #       | jq -r .projectStatus.status)
    #     echo "Quality Gate status: $status"
    #     if [ "$status" != "OK" ]; then
    #       echo "Quality Gate failed: $status"
    #       exit 1
    #     fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # environment: 
    #   name: ${{ github.ref_name }}
    strategy:
      matrix:
        environment: [dev, uat, prod]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 10
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Parse Centralized Variables
      id: parse-vars
      run: |
        DEPLOY_BASE_DIR=$(echo "${{ env.DEPLOY_BASE_DIR }}" | grep "${{ matrix.environment }}:" | cut -d':' -f2)
        WEB_ROOT=$(echo "${{ env.WEB_ROOT }}" | grep "${{ matrix.environment }}:" | cut -d':' -f2)
        SERVER_INFO=$(echo "${{ env.SERVERS }}" | grep "${{ matrix.environment }}:")
        SSH_HOST=$(echo $SERVER_INFO | cut -d':' -f2)
        SSH_USER=$(echo $SERVER_INFO | cut -d':' -f3)
        SSH_PORT=$(echo $SERVER_INFO | cut -d':' -f4)
        echo "DEPLOY_BASE_DIR=$DEPLOY_BASE_DIR" >> $GITHUB_ENV
        echo "WEB_ROOT=$WEB_ROOT" >> $GITHUB_ENV
        echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
        echo "SSH_USER=$SSH_USER" >> $GITHUB_ENV
        echo "SSH_PORT=$SSH_PORT" >> $GITHUB_ENV

    - name: Set up SSH key for environment
      run: |
          mkdir -p ~/.ssh
          if [[ "${{ matrix.environment }}" == "dev" ]]; then
            echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          elif [[ "${{ matrix.environment }}" == "uat" ]]; then
            echo "${{ secrets.UAT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          elif [[ "${{ matrix.environment }}" == "prod" ]]; then
            echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa

    - name: Add server to known hosts
      run: ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

    # - name: Set up SSH
    #   run: |
    #     mkdir -p ~/.ssh
    #     echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
    #     chmod 600 ~/.ssh/id_rsa
    #     ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

     #Generate the single version at the workflow level
    - name: Generate Deployment Version
      id: version
      run: |
        # Generate version using current date and time (IST)
        #CURRENT_DATE=$(date -d 'TZ="Asia/Kolkata" now' +"%Y%m%d-%H%M%S")
        CURRENT_DATE=$(TZ="Asia/Kolkata" date +"%Y%m%d-%H%M%S")
        TAGGED_VERSION="v${CURRENT_DATE}"
        echo "Deployment version: $TAGGED_VERSION"
        # Set the version as an output
        echo "::set-output name=version::$TAGGED_VERSION"
        # Also export it as an environment variable for other steps
        echo "TAGGED_VERSION=$TAGGED_VERSION" >> $GITHUB_ENV
  

    - name: Create Deployment Directory on VM
      run: |
        ssh -i ~/.ssh/id_rsa -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} powershell -Command "\$DeployDir = '${{ env.DEPLOY_BASE_DIR }}/$TAGGED_VERSION'; if (-Not (Test-Path \$DeployDir)) { New-Item -Path \$DeployDir -ItemType Directory }"

    - name: Manage Previous Deployments (Keep Last 3)
      run: ssh -i ~/.ssh/id_rsa -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "powershell -Command \"\$deploymentDir = '${{ env.DEPLOY_BASE_DIR }}'; \$deployments = Get-ChildItem -Path \$deploymentDir | Sort-Object LastWriteTime -Descending; if (\$deployments.Count -gt 3) { \$deployments | Select-Object -Skip 3 | Remove-Item -Recurse -Force }\""

    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: angular-artifacts
        path: ./my-artifacts

    - name: Upload Artifacts to VM
      run: scp -i ~/.ssh/id_rsa -P ${{ env.SSH_PORT }} -r ./my-artifacts/* ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:${{ env.DEPLOY_BASE_DIR }}/$TAGGED_VERSION/

    - name: Upload Deployment Script
      run: scp -i ~/.ssh/id_rsa -P ${{ env.SSH_PORT }} ./scripts/frontend_new_deploy.ps1 ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:${{ env.DEPLOY_BASE_DIR }}/frontend_new_deploy.ps1

    - name: Execute Deployment Script
      run: |
        ssh -i ~/.ssh/id_rsa -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "powershell -ExecutionPolicy Bypass -File ${{ env.DEPLOY_BASE_DIR }}/frontend_new_deploy.ps1 -WebRoot ${{ env.WEB_ROOT }} -DeployBaseDir ${{ env.DEPLOY_BASE_DIR }}"

    - name: Set environment variable based on branch
      run: |
        branch_name="${GITHUB_REF#refs/heads/}" # Strip out 'refs/heads/' from branch name
        environment=${branch_name}
        if [ "$environment" == "main" ]; then
          environment="prod"
        fi
        echo "ENVIRONMENT=$environment" >> $GITHUB_ENV
        echo "Environment is set to $environment"

    - name: Tag the commit
      if: ${{ success() }}  # Only tag if the workflow is successful
      run: |
        TAG="$ENVIRONMENT-$TAGGED_VERSION"
        echo "Tag: $TAG"  # Debugging the tag value
        git tag $TAG
        git push origin $TAG
    
