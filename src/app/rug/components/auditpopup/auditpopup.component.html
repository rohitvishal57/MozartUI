


  <div class="popup-modal active" id="modal-audit">
    <div class="popup-modal-dialog popup-modal-dialog-audit">
        <div class="popup-modal-content">
            <div class="popup-modal-header">
                <h5 class="popup-modal-title">Audit</h5>
                <button type="button" (click)="closeDialog()"  class="popup-btn-close jsClosePopup" data-bs-dismiss="modal-selfDetails" aria-label="modal-audit"></button>
            </div>
            <section id="quotes-list" class="tableMain quoteView block-show ">
                <div class="tableSubMain">
                    <div class="table-responsive">
                        <table class="table table-borderless table-search">
                          <thead>
                            <tr>
                                <th>SEQ NO</th>
                                <th>DISPOSITION</th>
                                <th>SUB-DISPOSITION</th>
                                <th>DATE-TIME</th>
                                <th>AGENT</th>
                                <th>REMARKS</th>
                                <th>AGENT TYPE</th>
                            </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let item of auditValue; let i = index">
                              <td class="text-center">{{i + 1}}</td>
                              <td class="text-center">{{item.disposition}}</td>
                              <td class="text-center">{{item.subDisposition}}</td>
                              <td class="text-center">{{item.loggedDate}}</td>
                              <td class="text-center">{{item.agent}}</td>
                              <td class="text-center">{{item.remarks}}</td>
                              <td class="text-center">{{item.agentType}}</td>
                          </tr>
                      </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
