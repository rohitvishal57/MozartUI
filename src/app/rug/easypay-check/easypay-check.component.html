<main class="siteBody">
    <div class="contentBody bodyColumns-1">
        <div class="bodyColumn body_flex_column">
            <div class="body_flex_row justify-content-between">
            </div>
            <div>
                <form>
                    <section class="white_container mb-3">
                        <div class="row">
                            <div class="col-12 mb-4">
                                <h6 class="heading-16-red">Request data</h6>
                            </div>
                            <div class="col-12 col-sm-12 col-md-6 col-lg-8 col-xl-8">
                                <div class="input-block form-floating input-block-renew">
                                    <textarea class="form-control" rows="5" name="requestData"
                                        [(ngModel)]="requestData"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary m-2" (click)="enquirePayment()">Enquire Payment</button>
                            </div>
                        </div>
                    </section>
                    <section class="white_container mb-3">
                        <div class="row">
                            <div class="col-12 mb-4">
                                <h6 class="heading-16-red">Response data</h6>
                            </div>
                            <div class="col-12 col-sm-12 col-md-8 col-lg-8 col-xl-8">
                                <div class="input-block form-floating input-block-renew">
                                    <textarea class="form-control" cols="40" rows="10" name="responseData"
                                        [(ngModel)]="responseData"></textarea>
                                        <!-- {{responseData}} -->
                                </div>
                                <button type="submit" class="btn btn-primary m-2" (click)="capturePayment()">Capture Payment</button>

                                <div class="input-block form-floating input-block-renew">
                                    <textarea class="form-control" cols="40" rows="10" name="captureResponse"
                                        [(ngModel)]="captureResponse"></textarea>
                                        <!-- {{responseData}} -->
                                </div>

                            </div>
                        </div>
                    </section>
                </form>
            </div>
        </div>
    </div>
</main>
