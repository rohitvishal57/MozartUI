<!-- Modal Start-->
<div class="modal popupModalMain show fade" id="OTPModal" tabindex="-1" aria-labelledby="OTPModalLabel"
    aria-hidden="true" style="display: block;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" >Confirm Captcha</h5>
                <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
            </div>
            <div class="modal-body" >
                <!--Captcha Field start-->
                <div class="row " [formGroup]="form">
                    <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
                        <div class="input-block m-0">
                            <label for="">Enter Captcha Code</label>
                        </div>
                    </div>
                    <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
                        <div class="input-block input-otp-block m-0"
                            [ngClass]="{ 'is-invalid': submitted && form.get('captchaInput')?.errors }">
                            <!-- <input type="text" name="otp-captcha" value="" placeholder="" class="input-textBox"> -->
                            <input type="text" id="captchaInput" formControlName="captchaInput" class="input-textBox" />
                            <!-- <span class="ui-error" *ngIf="form.get('captchaInput')?.">Please enter a valid captcha code</span> -->
                            <span class="ui-error block-show" *ngIf="submitted && form.get('captchaInput')?.errors?.['required']">Invalid
                                CAPTCHA, please try again</span>
                        </div>
                    </div>
                    <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
                        <canvas #captchaCanvas width="150" height="50" style="display: none;"></canvas>
                        <img [src]="captchaImage" alt="CAPTCHA" height="44px" />
                        <!-- <img [src]="captchaImage" alt="CAPTCHA" height="44px"/> -->
                        <button type="button" (click)="reloadCaptcha()"
                            style="height: 44px; margin-left: 5px; border-width: 0;"><mat-icon>refresh</mat-icon></button>
                    </div>
                </div>
                <!--Captcha Field end-->
            </div>
            <div class="modal-footer">
                <button  type="button" (click)="sendOtp()" id="validateotp" name="validateotp"
                    class="btn_red btn_fullWidth">Send OTP</button>
            </div>
        </div>
    </div>
</div>
<!-- Modal End-->
