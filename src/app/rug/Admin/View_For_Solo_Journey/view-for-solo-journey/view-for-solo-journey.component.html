<main class="siteBody">
    <div class="contentBody bodyColumns-1">
        <div class="bodyColumn body_flex_column">
            <div class="body_flex_row justify-content-between">
                <h2>View Lead Details</h2>
            </div>
            <section class="quickFilterMain">
                <div class="quickFilterRight">
                    <div class="body_flex_row leads_searchWraper">
                        <div class="field_searchMain">
                            <div class="filterFieldGroup">
                                <!-- <input class="filterSearch" id="filterSearch" name="filterSearch" placeholder="Filter"
                                    (input)="onInput($event)"> -->
                                <form [formGroup]="soloJourneyForm">
                                    <section class="white_container mb-3">
                                        <div class="row">
                                            <!-- <div class="col-12 mb-4">
                                            <h6 class="heading-16-red">AV Details</h6>
                                        </div> -->
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <input class="form-control input-textBox" id="mobileno" name="mobileno"
                                                        placeholder="Mobile Number" formControlName="mobileno" type="number">
                                                    <label for="mobileno">Mobile Number</label>
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <input class="form-control input-textBox" id="leadid" name="leadid"
                                                        placeholder="Lead Id" formControlName="leadid" type="text">
                                                    <label for="leadid">Lead Id</label>
                                                    
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <input class="form-control input-textBox" id="avname" name="avname"
                                                        placeholder="AV Name *" formControlName="avname" type="text">
                                                    <label for="avname">AV Name *</label>
                                                    
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <input class="form-control input-textBox" id="spcode" name="spcode"
                                                        placeholder="SP Code *" formControlName="spcode" type="text">
                                                    <label for="spcode">SP Code *</label>
                                                    
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <select class="form-select input-selectBox" id="avcenter"
                                                        name="avcenter" formControlName="avcenter">
                                                        <option value="" disabled selectedLocationId>Select Center
                                                        </option>
                                                        <option 
                                                            >
                                                           Location</option>
                                                    </select>
                                                    <label for="avcenter">Center *</label>
                                                   
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <select class="form-select input-selectBox" id="axisprocess"
                                                        name="axisprocess" formControlName="axisprocess">
                                                        <option value="" disabled selected>Select Axis Process</option>
                                                        <option  >
                                                        </option>
                                                    </select>
                                                    <label for="axisprocess">Axis Process*</label>
                                                    
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <input class="form-control input-textBox" id="lefdate"
                                                        name="lefdate" placeholder="License Expiry From Date *"
                                                        formControlName="lefdate" type="date" [max]="today">
                                                    <label for="lefdate">License Expiry From Date *</label>
                                                    
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <input class="form-control input-textBox" id="letdate"
                                                        name="letdate" placeholder="License Expiry To Date *"
                                                        formControlName="letdate" type="date" [max]="today">
                                                    <label for="letdate">License Expiry To Date *</label>
                                                    
                                                </div>
                                            </div>


                                            <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                                                <div class="input-block form-floating input-block-renew">
                                                    <button type="submit" id="save" name="save" class="btn_red">Clear
                                                        Filter</button>
                                                </div>
                                            </div>
                                        </div>
                                    </section>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </div>
</main>
