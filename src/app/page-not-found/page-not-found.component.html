<!--Body start-->
<main class="siteBody siteBody_renewJourney">
  <!--Main Columns start-->
  <div class="contentBody bodyColumns-1 mobile-flex-column">
    <div class="bodyColumn body_flex_column">
      <section class="white_container">

        <div class="main_commonError">
          <div class="submain_commonError">
            <img src="./assets/Img/img_404_error.svg">
            <h6>404 - Page Not Found</h6>
            <p>The page you are looking for does not exist.</p>
            <div class="body_flex_row justify-content-center">
              <button type="button" id="btn-404-goback" name="btn-404-goback" class="btn_pink" (click)="goBack()" >Go Back</button>
              <button type="button" id="btn-404-login" name="btn-404-login" class="btn_red" (click)="goToLogin()" >Login</button>
            </div>
          </div>
        </div>

      </section>
    </div>
  </div>
  <!--Main Columns end-->
</main>
<!--Body end-->
