<main class="siteBody">
    <div class="contentBody bodyColumns-1">
        <div class="bodyColumn body_flex_column">
            <div class="row">
                <div class="col-12">
                    <h2 class="mb-2">Products</h2>
                    <p>Discover our products to insure your health</p>
                </div>
            </div>
            <div class="row" *ngIf="ProductList.length > 0; else noProducts">
                <div class="col-12">
                    <div class="cardViewMain">
                        <div class="cardViewWraper">
                            <div class="cardViewItem" *ngFor="let item of ProductList">
                                <header>
                                    <div class="body_flex_row">
                                        <img src="assets/logo/activeOne.svg">
                                        <h6>{{item.productName}}</h6>
                                    </div>
                                </header>
                                <div class="cardViewBody">
                                    <p>{{item.productDescription}}</p>
                                </div>
                                <footer>
                                    <div class="btn_groupAction">
                                        <button class="btn_red btn_products btn_buy" (click)="buyNow(item)">
                                            <img src="assets/Img/trolley1.svg" alt="">
                                            Buy Now
                                        </button>
                                        <button class="btn_pink btn_products" >View Recommended Add-Ons</button>
                                        <button class="btn_grey btn_products btn_addtocompare" >
                                            <img src="assets/Img/left-and-right-arrows1.svg" alt="">
                                            Add to Compare
                                        </button>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="main-container" style="display: none;">
    <div class="left-panel-product">
        <div class="r-p-header" style="display: none;">
            <div class="product-heading">Products</div>
            <div class="prod-head-desc">Discover our products to insure your health
            </div>
        </div>

        <div class="product-list-container">
        <div *ngIf="ProductList.length > 0; else noProducts">
        <div  class="card_ProductList" >
            <div class="cardRow">

                <ng-container *ngFor="let item of ProductList">
                    <div class="cardItem box">
                        <!-- {{ item | json}}  -->
                        <div class="product-item">
                            <img src="assets/logo/activeOne.svg">
                            {{item.productName}}</div>
                        <p>{{item.productDescription}}</p>
                        <div class="product-button">
                            <button class="get" (click)="buyNow(item)">
                               <img src="assets/Img/trolley1.svg" alt="">
                               Buy Now
                            </button>
                            <button class="get1" >View Recommended Add-Ons</button>
                            <button class="get2" >
                                <img src="assets/Img/left-and-right-arrows1.svg" alt="">
                                Add to Compare
                            </button>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
        </div>
        <ng-template #noProducts>
            <div class="no-products-message" *ngIf="displayNoProductsMessage">No products available for the selected
                type.</div>
        </ng-template>
     </div>
    </div>
