<!--Header start-->
<header class="siteHeader block-hide">
          
    <!--ABC Links start-->
      <div class="abcLinksMain">
        <div class="abcTopLinks">
            <div class="abcHome">
                <a href="#" target="_blank"><img src="assets/Img/icon_home_white.svg">ABC Home<img src="assets/Img/icon_arrow_up_right_white.svg" class="homeArrow"></a>
            </div>
            <div class="abcSolution">
                <a href="#">ABC Solutions <img src="assets/Img/icon_arrow_down_red.svg"></a>
            </div>
            <div class="abcHelpLine">
                <a href="tel:+1800-270-7000"><img src="assets/Img/icon_phone_red.svg"> 1800-270-7000</a>
            </div>
        </div>
      </div>
    <!--ABC Links end-->
    
    <!--Logo Main start-->
      <div class="logoMain">
        <div class="logoMainLeft">
            <a href="#"><img src="assets/Img/abhi_logo.svg" alt="ABHI"></a>
        </div>
        <div class="logoMainRight">
            <div class="logoLeftNav"></div>
            <div class="logoRightNav">
                <div class="headerSearchMain">
                    <button type="button" class="btn_headerSearch"><img src="assets/Img/icon_magnify_grey.svg"></button>
                </div>
                <div class="changeLanguage">
                    <button type="button" class="btn_changeLanguage"><img src="assets/Img/icon_language_globe.svg"> <span id="language-value">ENG</span> <img src="assets/Img/icon_arrow_down_red.svg"></button>
                </div>
            </div>
        </div>
      </div>
    <!--Logo Main end-->
    
    <!--Logo Tag start-->
      <div class="logoTagMain">
        <div class="logoTagText">Aditya Birla Health Insurance</div>
      </div>
    <!--Logo Tag end-->
      
  </header>
  <!--Header end-->
<div class="main-container hsb">
    <div class="right-panel">
        <div class="main">
            <div class="sub-main">
                <div *ngIf="isDesktopView" class="logo">
                    <img src="assets/logo/ABHI_Logo.svg" alt="abhi-logo">
                </div>
                <div class="header">
                    <div class="header2">
                        <div class="header-left-cnt">
                            <div class="toolbar">
                                <button *ngIf="!isDesktopView" class="menu-button" (click)="toggleSidenav()">☰</button>
                                <div *ngIf="isDesktopView" class="menu">
                                    <a routerLink="viewdashboard" routerLinkActive="active-link">Dashboard</a>
                                    <a routerLink="viewProposals" routerLinkActive="active-link">Proposals</a>
                                    <a routerLink="viewproducts" routerLinkActive="active-link">Products</a>
                                    <a routerLink="renewalList" routerLinkActive="active-link">
                                        <div class="nav-text">Renewals</div>
                                    </a>
                                    <a routerLink="claimsList" routerLinkActive="active-link">Claims</a>
                                    <a routerLink="requests" routerLinkActive="active-link">Endorsements</a>
                                    <a routerLink="leadsList" routerLinkActive="active-link">Leads</a>
                                    <a routerLink="viewcustomer" routerLinkActive="active-link">Customers</a>
                                </div>    
                            </div>
                        </div>
                        <div class="header-right-cnt">
                            <div class="language-selector">
                                <select (change)="setLanguage($event)" [value]="currentLanguage">
                                  <option value="en">English</option>
                                  <option value="hi">Hindi</option>
                                  <option value="te">Telugu</option>
                                </select>
                            </div>  
                            <button class="logout-button" (click)="logOut()">Log Out</button>
                        </div>
                        <div class="sidenav" [class.active]="isSidenavOpen">
                            <a routerLink="viewdashboard" (click)="toggleSidenav()">Dashboard</a>
                            <a routerLink="viewProposals" (click)="toggleSidenav()">Proposals</a>
                            <a routerLink="viewproducts" (click)="toggleSidenav()">Products</a>
                        </div>
                    </div>
                </div>
            </div>
            <p class="abhifont">Aditya Birla Health Insurance</p>
        </div>
        <div class="body">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-scale-multiple" [fullScreen]="true">
    <p style="color: white;font-size: 14px;"> Loading... </p>
  </ngx-spinner>
