<nav id="siteSidenav" class="siteSidenav" [ngClass]="{'expand': isExpanded, 'active': isActive}" *ngIf="agentCode != '467899' && agentCode != '467898'">
    <div class="siteSidenavMain siteSidenavMain_scroll">
      <div class="sidenavMenu sidenavMenu_links">
        <a *ngFor="let item of sideMenuList" 
           [ngClass]="{'active': isRouteActive(item.path)}" 
           [title]="item.displayName" 
           (mouseenter)="expandSideNav()" 
           (mouseleave)="collapseSideNav()" 
           (click)="redirect(item.path)">
          <span class="img_link">
            <img [src]="item.imagePath" [alt]="item.displayName">
          </span>
          <span>{{ item.displayName | translate}}</span>
        </a>
      </div>
    </div>
    <div class="sidenavMenu sidenavMenu_logout">
      <a title="logout" (mouseenter)="expandSideNav()" (mouseleave)="collapseSideNav()" class="linkLogout" [routerLink]="['']"><span class="img_link"><img src="assets/Img/icon_menu_logout.svg"></span><span>{{"Logout" | translate}}</span></a>      
    </div>
</nav>
