<!--Header start-->
<header class="siteHeader">

  <!--ABC Links start-->
  <div class="abcLinksMain">
    <div class="abcTopLinks">
      <div class="abcHome">
        <a target="_blank"><img src="assets/Img/icon_home_white.svg">ABC Home<img
            src="assets/Img/icon_arrow_up_right_white.svg" class="homeArrow"></a>
      </div>
      <div class="abcSolution">
        <a>ABC Solutions <img src="assets/Img/icon_arrow_down_red.svg"></a>
      </div>
      <div class="abcHelpLine">
        <a href="tel:+1800-270-7000"><img src="assets/Img/icon_phone_red.svg"> 1800-270-7000</a>
      </div>
    </div>
  </div>
  <!--ABC Links end-->

  <!--Logo Main start-->
  <div class="logoMain">
    <div class="logoMainLeft">
      <a><img src="assets/Img/abhi_logo.svg" alt="ABHI"></a>
    </div>
    <div class="logoMainRight">
      <div class="logoLeftNav">
        <!-- <div class="icon_menuMobile">
                  <button type="button" class="btn_menuMobile" aria-label="siteSidenav">
                      <span></span><span></span><span></span>
                  </button>
              </div> -->
      </div>
      <div class="logoRightNav">
        <!-- <div class="headerSearchMain">
                  <button type="button" class="btn_headerSearch"><img src="assests/Img/icon_magnify_grey.svg"></button>
              </div> -->
        <div class="header-right-cnt">
          <div class="language-selector">
            <select (change)="setLanguage($event)" [value]="currentLanguage">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="te">Telugu</option>
            </select>
          </div>
          
        </div>
        <div class="headerProfile" >
          <a [routerLink]="['/profile']" *ngIf="isLoggedIn">
            <img  src="../../../assets/images/name.png" >
          </a>
        </div>
 <div class="header_notification"> 

        <button type="button" id="count-notification" name="count-notification" class="btn_headerSearch" *ngIf="isLoggedIn;" (click)="openNotifications()">
          <img  src="../../../assets/Img/icon_notifications.svg" >
          <span class="badge" *ngIf="notificationCount > 0">{{notificationCount}}</span>
        </button>
        <!--Overlay: Notifications start-->
        <div class="overlay_popupMain overlay_dropdown_w386 overlay_notification" *ngIf="showNotifications">
          
          <div class="option_policyType">
            <div class="overlay_body insurer_detailsMain">
              <h3>Notifications ({{notificationCount}})</h3>
              <div class="checkbox_disease_scroll">           
                <div class="row">
                  <div class="col-12">
                    <div class="input-block input-block-renew input-filed-white">
                      <ul class="notificationList">
                        <li *ngFor="let notification of notifications ; let i =index">
                          <div class="tipInfo_org"><img src="assets/Img/icon_lightbulb.svg">{{notification.message}}</div>
                        </li>
                        <li class="read_notification">
                          <div class="tipInfo_org"><img src="assets/Img/icon_lightbulb.svg">Don't forget to talk to your fit customers about how they can earn back a 100% of their premium through the activ fit and activ health platinum enhanced plans</div>
                        </li>
                      </ul>
                      <!--<mat-list-item *ngFor="let notification of notifications ; let i =index">
                        <span style="color: black;">{{i+1}}: {{notification.message}}</span>
                      </mat-list-item>-->
                    </div>
                  </div>
                </div>
              </div> 
           
            </div>
            <div class="overlay_footer">
              <div class="btn_groupAction">
                <button id="markAll" name="markAll" type="button" class="btn_red btn_markAsRead">Mark All As Read</button>
                <button id="showAll" name="showAll" type="button" class="btn_linkText">Show All </button>
              </div> 
            </div>
          </div>
        </div>
        <!--Overlay: Notifications end-->
  
       </div> 
      </div>
    </div>
  </div>
  <!--Logo Main end-->

  <!--Logo Tag start-->
  <div class="logoTagMain">
    <div class="logoTagText">Aditya Birla Health Insurance</div>
  </div>
  <!--Logo Tag end-->
</header>
<!--Header end-->
