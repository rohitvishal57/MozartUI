<main class="siteBody  main_productDetails" >
  <div class="contentBody bodyColumns-1">
    <div class="bodyColumn body_flex_column">

      <div class="body_flex_row justify-content-between">
          <h2 class="icon_withHeading" >{{"Product Details" | translate}}</h2>
      </div>

      <section class="white_container">
        <div class="detailsRow">
          <div class="row">
            <div class="col-12">
              <div class="productInfoDetails">
                <div class="planProductInfo">
                  <div class="ppi_img">
                    <img src="assets/Img/icon_activeone.svg">
                  </div>
                  <div class="ppi_info">
                    <h4>{{state.productName | translate}}</h4>
                    <h5>{{"Aditya Birla Health Insurance" | translate}}</h5>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <p>{{state.productDescription | translate}}</p>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <ul class="tick_round">
                  <li *ngFor="let key of state.keyFeatures"><img src="assets/Img/icon_tick_org.svg">{{ key }}</li>
              </ul>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-12">
                <div class="custom_tabView">
                  <div class="tabview_topContainer">
                    <div class="top-container" #topContainer>
                      <p-tabView [(activeIndex)]="activeIndex" (onChange)="onTabChange($event)">
                       <p-tabPanel header="Health Add-Ons"></p-tabPanel> 
                       <p-tabPanel header="Optional Covers"></p-tabPanel> 
      
                      </p-tabView>
                    </div>
                  </div>
                  <div class="tabview_bottomContainer" [ngSwitch]="activeIndex" >
                      <div class="tabview_cardContentMain" *ngSwitchCase=activeIndex>
                          <div class="tabview_cardContent" *ngFor="let section of groupedFeatures | keyvalue">
                            <div class="tabview_cardItem" *ngIf="section.key === displayInfo">
                              
                              <div class="tabview_cardMain" >
                                <div  class="tabview_cardItem"  >
                                  <ul class="tick_round">
                                      <li *ngFor="let feature of section.value"><img src="assets/Img/icon_tick_green_bg.svg"><div class="feature-text">
                                        {{ feature.featureName | translate}}
                                      </div></li>
                                  </ul>
                                </div>
                              </div>
                            </div>
                          </div>
                      </div>
                  </div>
                </div>
            </div>
          </div>
          
        </div>
      </section>
      <div class="row mt-3">
        <div class="col-12">
          <button type="button" id="buynow-details" name="buynow-details" class="btn_red btn_products btn_buy" (click)="buyNow(state)">
            <img src="assets/Img/trolley1.svg" alt="">
            {{"Buy Now" | translate}}
        </button>
        </div>
      </div>
    </div>
  </div>
</main>
