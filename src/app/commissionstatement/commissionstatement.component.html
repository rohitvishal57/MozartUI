<main class="siteBody">
    <div class="contentBody bodyColumns-1">
        <div class="bodyColumn body_flex_column">
            <div class="body_flex_row justify-content-between">
                <h4 class="icon_withHeading m-0">
                    Commission Statement
                </h4>
            </div>
            <section class="white_container">
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
                        <h4> <u>Commission statement download is currently available from April’21 cycle. We are
                            working on previous download statement and will be available soon.</u></h4>
                        <h2>My Commission Statements</h2>
                    </div>
                </div>
                <br>
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                        <div class="input-block form-floating input-block-renew">
                            <select class="form-select input-selectBox" id="commsionsYear" name="commsionsYear" >
                            <option value="" disabled selected>{{"Choose Option" }}</option>
                            <option *ngFor="let year of commisonYears" [value]="year">
                                {{ year }}
                            </option>
                        </select>
                            <label for="year">{{"year"}}</label>
                        </div>
                    </div>
                    <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                        <div class="input-block form-floating input-block-renew">
                            <select class="form-select input-selectBox" id="commsionsYear" name="commsionsYear" >
                            <option value="" disabled selected>{{"Choose Option" }}</option>
                            <option *ngFor="let year of commisonMonth" [value]="year">
                                {{ year }}
                            </option>
                        </select>
                            <label for="month">{{"month"}}</label>
                        </div>
                    </div>

                    <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4">
                        <div class="input-block form-floating input-block-renew">
                            <select class="form-select input-selectBox" id="commsionsYear" name="commsionsYear" >
                            <option value="" disabled selected>{{"Choose Option" }}</option>
                            <option *ngFor="let cycle of commsionsCycle" [value]="cycle">
                                {{ cycle }}
                            </option>
                        </select>
                            <label for="cycle">{{"cycle"}}</label>
                        </div>
                    </div>
                    <div class="row mt-4" >
                        <div class="col-12">
                            <button type="submit" id="save" name="save" class="btn_red">{{" Download Statement"}}</button>
                        </div>
                    </div>
                </div>
            </section>
            

            
        </div>
    </div>

</main>
