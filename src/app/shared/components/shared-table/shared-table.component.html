<main class="siteBody">
    <div class="contentBody bodyColumns-1">
        <div class="bodyColumn body_flex_column">
            <div class="body_flex_row justify-content-between">
                <h2>{{tableData.title}}</h2>
                <div *ngFor="let btn of tableData?.actionbtnList">
                    <button type="button" [id]="btn.name" [name]="btn.name" [class]="btn.class"
                        (click)="redirectActionBtn($event)">
                        <img [src]="btn.icon">{{btn?.name}}
                    </button>
                </div>
            </div>
            <section class="quickFilterMain">
                <div class="quickFilterLeft" #filterSection>
                    <ul class="quickFilter">
                        <li *ngFor="let filterItems of tableData?.filterList"><button type="button"
                                [id]="filterItems.name" [name]="filterItems.name" [value]="filterItems.name"
                                [ngClass]="getClass(filterItems?.name)" (click)="statusFilter(filterItems.name)"
                                class="btn_quickFilter btn_quickFilterClaim">{{filterItems.name}}
                            </button></li>
                    </ul>
                </div>
                <div class="quickFilterRight">
                    <!--Search section start-->
                    <div class="body_flex_row endorsements_searchWraper">
                        <div class="field_searchMain">
                            <select [(ngModel)]="selectedFilterOption" class="filterSearch"
                                (change)="onSelectChanges($event)">
                                <option *ngFor="let options of tableData?.filterOptionsList" [value]="options">
                                    {{options}}</option>
                            </select>
                            <input class="filterSearch" id="endorsementSearchInput" type="text"
                                [placeholder]="selectedFilterOption == undefined ? 'Search...' : 'Enter ' + selectedFilterOption">
                            <button type="button" id="endorsementSearchBtn" name="endorsementSearchBtn" class="btn_text"
                                (click)="applySearch()"><img src="assets/Img/icon_magnify_grey.svg"></button>
                            <button type="button" id="gridlist" name="gridlist" value="gridlist"
                                class="btn_grid mobile-hide jsBtnClickQuote" aria-label="quotes-list"
                                [ngClass]="{'active': tableData?.selectedView === 'list'}"
                                (click)="quotesViews('list')"><img src="assets/Img/icon_grid_list_grey.svg"
                                    alt="Grid List"></button>
                            <button type="button" id="gridcard" name="gridcard" value="gridcard"
                                class="btn_grid mobile-hide jsBtnClickQuote" aria-label="quotes-card"
                                [ngClass]="{'active': tableData?.selectedView === 'grid'}"
                                (click)="quotesViews('grid')"><img src="assets/Img/icon_grid_box_grey.svg"
                                    alt="Grid Card"></button>
                        </div>
                    </div>

                </div>
            </section>
            <section id="quotes-list" class="tableMain quoteView block-show " *ngIf="tableData?.selectedView == 'list'">
                <div class="tableSubMain">
                    <div class="table-responsive">
                        <table class="table table-borderless table-search">
                            <thead>
                                <tr *ngFor="let heading of tableData?.tableRes?.headerList">
                                    <th scope="col">{{heading?.name}}</th>
                                </tr>
                            </thead>
                            <tbody class="table-group-divider">
                                <tr class="table-values" *ngFor="let tData of tableData?.tableRes?.resourceList">
                                    <td class="td-text-bold">{{ getAssign(tData) }}</td>

                                    <!-- <td>
                                        <button type="button" id="viewdetails" name="viewdetails" value="View Details"
                                            title="View Details" class="btn_action btn_renewalAction"
                                            (click)="getEndorsementCaseDetails(row)"><img
                                                src="assets/Img/icon_renewable_energy_grey.svg"></button>
                                    </td> -->

                                </tr>
                            </tbody>
                            <tbody class="table-group-divider tbody-no-data" *ngIf="tableData?.resourceList?.length">
                                <tr>
                                    <td colspan="10">
                                        <div class="no_dataFound">
                                            <img src="assets/Img/img_no_data_found.svg" alt="No Data Found" />
                                            <p>No data found</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            
        </div>
    </div>
</main>
