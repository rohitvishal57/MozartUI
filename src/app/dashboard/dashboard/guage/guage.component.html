<div class="gauge-container">
    <ng-container [ngSwitch]="guageType">
        <div *ngSwitchCase="'circular'">
            <svg viewBox="0 0 36 36" class="circular-chart">
                <!-- Background circle -->
                <path class="circle-bg" d="M18 2.0845
               a 15.9155 15.9155 0 0 1 0 31.831
               a 15.9155 15.9155 0 0 1 0 -31.831" />

                <!-- Gauge progress -->
                <path class="circle" [attr.stroke-dasharray]="progress + ', 100'" d="M18 2.0845
               a 15.9155 15.9155 0 0 1 0 31.831
               a 15.9155 15.9155 0 0 1 0 -31.831" />

                <!-- Text in the center -->
                <text x="18" y="20.35" class="percentage">{{ progress }}%</text>
            </svg>
        </div>
        <div *ngSwitchCase="'half-moon'">
            <div class="gauge-container">
                <svg class="gauge" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet">
                  <!-- Background arc -->
                  <path
                    d="M10,50 A40,40 0 0,1 90,50"
                    stroke="#ddd"
                    fill="none"
                    stroke-width="8"
                  ></path>
              
                  <!-- Dynamic arc (foreground) -->
                  <path
                    [attr.d]="arcPath"
                    stroke="#0078d4"
                    fill="none"
                    stroke-width="8"
                    stroke-linecap="round"
                  ></path>
                </svg>
                <div class="gauge-label">
                  <span>{{ halfProgress }}%</span>
                </div>
              </div>
              
        </div>
        <div *ngSwitchDefault>
            <div class="gauge-container">
                <mat-progress-bar mode="determinate" [value]="progress" [color]="'primary'"
                    class="linear-gauge"></mat-progress-bar>
                <!-- <div class="gauge-label">{{ progress }}%</div> -->
            </div>
        </div>
    </ng-container>

</div>
