<div class="login-mainContainer">
    <div class="body">
      <router-outlet></router-outlet>
    </div>
    <div class="login-formMain">
      <div class="login-form">
        <h1>{{"Welcome to Aditya Birla Health Insurance" | translate}}</h1>

        <form [formGroup]="loginForm" *ngIf="loginWithUsername">
          <div class="input-block form-floating input-block-renew">
            <input class="form-control input-textBox" type="text" id="userName" name="userName" placeholder="" formControlName="userName" (keydown)="onKeyDownEvent()">
            <label for="userName">{{"AgentCode/Email/IRDA License Number" | translate}}<span class="text-danger">*</span></label>
            <small *ngIf="loginForm.controls['userName'].touched && !loginForm.controls['userName'].hasError('maxlength') && loginForm.controls['userName'].hasError('required')" class="text-danger">{{"AgentCode/Email/IRDA License Number is required" | translate}}</small>
            <small *ngIf="isSubmitted" class="text-danger">{{userErrorMsg | translate}}</small>
          </div>

          <div class="d-flex flex-row justify-content-between captcha-container">
            <div class="col-6 input-block form-floating input-block-renew">
                <input class="form-control input-textBox" id="captcha" name="captcha" placeholder="" (keydown)="onKeyDownEvent()" type="text" formControlName="captcha" />
                <label for="captcha">{{"Enter CAPTCHA" | translate}}<span class="text-danger">*</span></label>
                <small *ngIf="loginForm.controls['captcha'].touched && loginForm.controls['captcha'].hasError('required') && !isSubmitted" class="text-danger">{{"Captcha is required" | translate}}</small>
                <small *ngIf="isSubmitted" class="text-danger">{{captchaErrorMsg | translate}}</small>
            </div>
            <div class="col-6">
                <label class="captcha-label">
                    <span *ngFor="let char of captchaCode.split('')">{{ char }}</span>
                </label>
                <mat-icon style="position: relative; top: 5px; left:5px; cursor: pointer;" (click)="refreshCaptcha()">refresh</mat-icon>       
            </div>
          </div>

          <div class="row pt-4">
            <div class="col-6 pad-0">
              <button id="loginwithsso" name="loginwithsso" (click)="onSubmit('SSO')">{{"Login with SSO" | translate}}</button>
            </div>
            <div class="col-6 pad-0">
              <button id="loginwithotp" name="loginwithotp" (click)="onSubmit('OTP')">{{"Login with OTP" | translate}}</button>
            </div>
            <div class="text-danger" name="resetpassword" id="resetpassword" (keydown.enter)="onSubmit('RESET')" (click)="onSubmit('RESET')" style="text-align: center; text-decoration: underline; cursor: pointer;"><span class="p-2" [tabindex]="0">{{"Reset password" | translate}}</span></div>
          </div>
        </form>

        <div class="verify-e-p-otp-wrap" *ngIf="verifyOtpEnable">
          <label class="otp-text-wrap">The OTP has been to {{ maskedUserCode }}</label>
          <div class="otp-container">
            <input type="password" id="otp0" class="otp-input" maxlength="1" [(ngModel)]="otp[0]" (keydown)="onKey($event, 0)">
            <input type="password" id="otp1" class="otp-input" maxlength="1" [(ngModel)]="otp[1]" (keydown)="onKey($event, 1)">
            <input type="password" id="otp2" class="otp-input" maxlength="1" [(ngModel)]="otp[2]" (keydown)="onKey($event, 2)">
            <input type="password" id="otp3" class="otp-input" maxlength="1" [(ngModel)]="otp[3]" (keydown)="onKey($event, 3)">
            <input type="password" id="otp4" class="otp-input" maxlength="1" [(ngModel)]="otp[4]" (keydown)="onKey($event, 4)">
            <input type="password" id="otp5" class="otp-input" maxlength="1" [(ngModel)]="otp[5]" (keydown)="onKey($event, 5)">
          </div>
          <button type="submit" id="verifylogin" name="verifylogin" (click)="onVerifyOTP()">
            <span>{{"Verify & Login" | translate}}</span>
          </button>
          <p class="text-danger text-center">{{errorMessage | translate}}</p>
          <div class="d-flex justify-content-center" *ngIf="timerOn">
            <label *ngIf="timeLeft > 0" class="send_otp_again_wrap">{{"Send OTP again in" | translate}} <span class="timeLeft_color">{{timeLeft}}</span> seconds </label>
            <label *ngIf="timeLeft == 0" class="send_otp_again_wrap p-2" (click)="resendOTP()" (keydown.enter)="resendOTP()" [tabindex]="0">{{"Resend OTP" | translate}}</label>
          </div>
        </div>
        
      </div>
    </div>
    <div class="background-image2">
      <img src="assets/Img/background_img_abhi.png" class="">
    </div>
  </div>
