<div class="send-otp-formMain">
    <div class="send-otp-form"  >
        <div class="d-flex justify-content-end">
            <label class="otp-header-wrap-x cursor" (click)="close()">X</label>
        </div>
        <div class="d-flex justify-content-center pt-3">
            <label class="otp-header-wrap">{{"Send OTP Via" | translate}}</label>
        </div>
        <div class="d-flex justify-content-start ">
            <label class="otp-sub-wrap">{{"Please select mobile number/email to send OTP." | translate}}</label>
        </div>

        <div class="send-otp-form-section">
            <div class="row pt-3 pb-4" *ngIf="filteredContacts.length > 0">
                <div class="col-6" *ngFor="let contact of filteredContacts; let i = index">
                    <div class="contact-card-wrap" (click)="onSelect(contact)">
                        <div class="contact-card-wrap-info" [tabindex]="i+1" (keydown.enter)="onSelect(contact)">
                            <label>{{maskUserCode(contact)}}</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row pt-3 pb-4" *ngIf="filteredContacts.length == 0">
                <div class="col-12" >
                    <div class="contact-card-wrap" >
                        <div class="contact-card-wrap-info d-flex justify-content-center">
                            <label>{{"Invalid User Code/No Data Found" | translate}}</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
